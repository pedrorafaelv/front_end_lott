<a>carrusel cartones</a>

<div class="carousel-wrapper">
  <button class="carousel-btn prev" (click)="prevSlide()">‹</button>
  <div class="carousel-container">
    <div class="carousel-track" #track>
      @for (carton of filteredCartones; track carton.id) {
        <div class="card"
             [class.selected]="isSelectedByMe(carton.id)"
             [class.disabled]="isTakenByOther(carton)"
             (click)="!isTakenByOther(carton) && seleccionarCarton(carton.id)">
          
          <div class="card-title">{{ carton.nombre }}</div>
           
          <div class="card-grid">
            @for (celda of carton.grid; track celda) {
              <div class="card-cell" [class.free]="celda.libre">
                {{ celda.figura }}
              </div>
            }
          </div>
          
          <div class="card-badge">
            <span class="card-id">ID: {{ carton.id }}</span>
            <span class="card-status" [class]="getStatusInfo(carton).class">
              {{ getStatusInfo(carton).text }}
            </span>
          </div>
          
          <div class="card-actions">
            <button class="card-select-btn" 
                    [class]="getButtonInfo(carton).class"
                    [disabled]="getButtonInfo(carton).disabled"
                    (click)="$event.stopPropagation(); seleccionarCarton(carton.id)">
              {{ getButtonInfo(carton).text }}
            </button>
            @if (isSelectedByMe(carton.id)) {
              <div class="player-badge">👤 Tú</div>
            }
            @if (isTakenByOther(carton)) {
              <div class="player-badge other">👤 Otro</div>
            }
          </div>
        </div>
      }
    </div>
  </div>
  <button class="carousel-btn next" (click)="nextSlide()">›</button>
</div>
