 <div class="continer">
     <section class="botton-container bg-dark">
      <div class="carrusel-cartones-placeholder" aria-label="Carrusel de cartones"></div>
    </section>
    <section class="cartones-container  bg-dark" *ngIf="fichagroup">
        <h2 class="fw-bold">Cartones</h2>
        <div class="h3"> cartones poster grid</div>
        <div class="row">
            <div *ngFor="let carton of cartones" class="col mb-5">
                <app-carton [carton]="carton" ></app-carton>         
              <div class="card-footer p-1 bg-transparent text-center ">
                <a class="btn btn-outline-primary mt-auto" (click)=putCard(carton.id)>Add to cart</a>
              </div>
            </div>
        </div>
    </section> 
</div>
<div class="lottery-container">

  <!-- Sección de cartones -->
  <section class="cards-section" *ngIf="fichagroup">
    <div class="section-header">
      <i class="bi bi-grid-3x3-gap"></i>
      <h2>Cartones disponibles</h2>
      <p>Selecciona los cartones que deseas agregar a tu carrito</p>
    </div>
    
    <div class="cards-grid">
      <div *ngFor="let carton of cartones" class="card-item">
        <div class="card-header">
          <h3>Cartón #{{carton.id}}</h3>
          <span class="card-badge">{{carton.name}}</span>
        </div>
        <app-carton [carton]="carton" ></app-carton>
        
        <div class="card-actions">
          <button class="btn-add-cart" (click)="putCard(carton.id)">
            <i class="bi bi-cart-plus"></i> Agregar al carrito
          </button>
        </div>
      </div>
    </div>
  </section>
</div>
