
<div class="juego-container">
  <!-- Encabezado estilo lotería -->
  <div class="loteria-header">
    <!-- Publicidad en header -->
    <div class="publicidad-header">
      <div class="publicidad-content">
        <div class="ad-flag"><i class="fas fa-flag"></i></div>
        <div class="ad-text">¡Sorteo especial este viernes! Premio mayor de $100,000</div>
        <app-carrusel-cartones></app-carrusel-cartones>
        <div class="ad-flag"><i class="fas fa-flag"></i></div>
        <div class="stats-container">
        </div>
      </div>
    </div>
  </div>
  <div class="main-content">
    <!-- Panel izquierdo -->
    <div class="left-panel">
      <!-- Publicidad en panel lateral -->
      <div class="publicidad-side">
        <app-publicity></app-publicity>
      </div>
    </div>
    <!-- Panel central -->
    <div class="center-panel">
      <div class="game-card">
        <div class="card-header">
          <div class="stat">
            <i class="fas fa-ticket-alt"></i> Fichas Jugadas:  {{fichas?.length || 0}}
          </div>
          <div class="stat">
            <div class="stat-label">Cartones Jugados:
            {{cartones?.length || 0}}</div>
          </div>
          <button type="button" (click)=getNewRecord() class="lotto-button primary">
            <i class="fas fa-plus"></i> Nueva Ficha
          </button>
        </div>
        <app-records [Fichas]="fichas" [Raffle]="raffle" [fichaGroup]="fichaGroupName"></app-records>
        <!-- <div class="fichas-container">
          <cdk-virtual-scroll-viewport class="viewport" itemSize="50" style="height: 400px; width: 100%;">
              <div *ngFor="let item of fichas" class="ficha-item">
              <img [src]="item.image | imagen:color" class="ficha-img" appNotImage>
            </div>
          </cdk-virtual-scroll-viewport>
        </div> -->
      </div>
      <!-- Publicidad entre secciones -->
      <div class="game-card">
        <div class="card-header">
          <h2><i class="fas fa-grid"></i> Mis Cartones</h2>
          <button class="lotto-button success">
            <i class="fas fa-trophy"></i> ¡Gané!
          </button>
        </div>
        <div class="cartones-container">
            <!-- <cdk-virtual-scroll-viewport itemSize="70" class="viewport"> -->
                <div *ngFor="let carton of cartones" class="carton-item">
                  <app-carton [carton]="carton"></app-carton>
                </div>
            <!-- </cdk-virtual-scroll-viewport> -->
        </div>
      </div>
    </div>
    <!-- Panel derecho -->
    <div class="right-panel">
      <div class="panel-card">
        <div class="publicidad-side">
        <app-publicity></app-publicity>
      </div>
        <!-- <h3><i class="fas fa-info-circle"></i> Información del Sorteo</h3> -->
        <div class="sorteo-info">
          <div class="info-item">
            <span class="label">Premio:</span>
            <span class="value">$50,000</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
