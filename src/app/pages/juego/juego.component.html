<div class="juego-container">
    
    <!-- ============================================
         HEADER - 28% de altura
         Banner + Carrusel de cartones disponibles
         ============================================ -->
    <header class="loteria-header">
        
        <!-- Banner publicitario compacto y centrado -->
        <div class="ad-banner">
            <i class="fas fa-bullhorn"></i>
            <span class="ad-text">¡Sorteo especial este viernes! Premio mayor de $100,000</span>
        </div>
        
        <!-- Carrusel de cartones disponibles -->
        <div class="header-carrusel" [class.hidden-visual]="fichas.length > 2">
            <app-carrusel-cartones 
                [raffleId]="raffleId" 
                [UserId]="userId"
                (actualizarSaldo)="onActualizarSaldo($any($event))"
                (actualizarMisCartones)="onActualizarMisCartones($any($event))">
            </app-carrusel-cartones>
        </div>
        <div class="header-carrusel" [class.hidden-visual]="fichas.length < 2">
            
            <app-bouncing-ball [imagenActual]="imagenFichaActual"
                        [nombreFicha]="nombreFichaActual">></app-bouncing-ball>
        </div>
    </header>

    <!-- ============================================
         CONTENIDO PRINCIPAL - 72% de altura
         Grid: 20% - 60% - 20%
         ============================================ -->
    <main class="main-content">
        
        <!-- Columna Izquierda: Publicidad 20% -->
        <aside class="left-column">
            <div class="panel-card ad-panel full-height">
                <div class="panel-header">
                    <!-- <i class="fas fa-ad"></i>
                    <span>Publicidad</span> -->
                </div>
                <div class="panel-body ad-body">
                    <app-publicity></app-publicity>
                </div>
            </div>
        </aside>

        <!-- Columna Central: Fichas + Mis Cartones 60% -->
        <section class="center-column">
            
            <!-- Fichas -->
            <div class="game-card fichas-card">
                <div class="card-header">
                    <div class="stat">
                        <!-- <i class="fas fa-ticket-alt"></i> -->
                        <span>Fichas: {{ fichas?.length || 0 }}</span>
                    </div>
                    <div class="stat">
                        <!-- <i class="fas fa-hashtag"></i> -->
                        <span>Sorteo: {{ raffleId }}</span>
                    </div>
                    <button type="button" (click)="getNewRecord()" class="btn-nueva-ficha">
                        <!-- <i class="fas fa-plus"></i> Nueva Ficha -->
                    </button>
                </div>
                
                <div class="card-body">
                    <app-records 
                        [Fichas]="fichas" 
                        [Raffle]="raffle" 
                        [fichaGroup]="fichaGroupName">
                    </app-records>
                </div>
            </div>

            <!-- Mis Cartones -->
            <div class="game-card cartones-card">
                <div class="card-header">
                    <h5>
                        <!-- <i class="fas fa-th-large"></i>  -->
                        Mis Cartones ({{ MyCards?.length || 0 }})
                    </h5>
                    <button class="btn-gane">
                        <i class="fas fa-trophy"></i> ¡Gané!
                    </button>
                </div>
                
                <div class="card-body cartones-scroll">
                    <div class="cartones-container">
                        <div *ngFor="let carton of MyCards" class="carton-item">
                            <div class="card-carton">
                                <div class="card-carton-header">
                                    <!-- <span class="carton-title">Cartón #{{ carton.id }}</span> -->
                                    <button class="remove-card" (click)="eliminarCarton(carton.id)" title="Eliminar cartón">
                                        <i class="fas fa-times"></i>
                                    </button>
                                </div>
                                <div class="card-carton-body">
                                    <app-carton [carton]="carton"></app-carton>
                                </div>
                            </div>
                        </div>
                        
                        <div *ngIf="MyCards?.length === 0" class="empty-state">
                            <i class="fas fa-inbox"></i>
                            <p>No tienes cartones en este sorteo</p>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Columna Derecha: Publicidad 20% -->
        <aside class="right-column">
            <div class="panel-card ad-panel full-height">
                <div class="panel-header">
                    <!-- <i class="fas fa-ad"></i>
                    <span>Publicidad</span> -->
                </div>
                <div class="panel-body ad-body">
                    <app-publicity></app-publicity>
                </div>
            </div>
        </aside>
    </main>
</div>
